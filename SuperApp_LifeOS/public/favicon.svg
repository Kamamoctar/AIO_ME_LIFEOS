<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141d36"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="purpleAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00D9FF" stroke-width="3" stroke-opacity="0.5"/>
  
  <!-- Shadow Monarch Wings / Dagger Crest -->
  <g filter="url(#glow)">
    <!-- Wings Aura -->
    <path d="M256 60 C290 140 400 180 430 300 C370 300 320 250 256 220 C192 250 142 300 82 300 C112 180 222 140 256 60 Z" fill="url(#purpleAura)" opacity="0.6"/>
    
    <!-- Central Blade -->
    <path d="M256 80 L280 260 L256 420 L232 260 Z" fill="url(#neonCyan)"/>
    
    <!-- Dagger Guard & Crown -->
    <path d="M190 280 L256 250 L322 280 L290 310 L256 295 L222 310 Z" fill="#ffffff"/>
    
    <!-- Level Rank Gem -->
    <polygon points="256,330 275,360 256,390 237,360" fill="#00D9FF"/>
    
    <!-- Monarch Eye / Core -->
    <circle cx="256" cy="210" r="8" fill="#ffffff"/>
  </g>
</svg>
