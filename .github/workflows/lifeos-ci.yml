name: LifeOS CI

on:
  push:
    paths:
      - "SuperApp_LifeOS/**"
      - ".github/workflows/lifeos-ci.yml"
  pull_request:
    paths:
      - "SuperApp_LifeOS/**"
      - ".github/workflows/lifeos-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SuperApp_LifeOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SuperApp_LifeOS/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
